name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulator tests
        run: npm test
      - name: Browser tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
